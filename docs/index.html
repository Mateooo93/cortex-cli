<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cortex-cli</title>
  <meta name="description" content="cortex-cli TUI preview">
  <meta property="og:title" content="cortex-cli">
  <meta property="og:image" content="https://mateooo93.github.io/cortex-cli/assets/cortex-cli-screenshot.png">
  <link rel="icon" href="assets/cortex.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e17;
      --border: #2a3348;
      --text-muted: #8b949e;
      --terminal-bg: #0d1117;
      --terminal-title: #21262d;
      --accent: #58a6ff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text-muted);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      padding: 24px 16px 32px;
    }

    .terminal {
      width: min(960px, 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      background: var(--terminal-bg);
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--terminal-title);
      border-bottom: 1px solid var(--border);
    }

    .dots { display: flex; gap: 7px; }
    .dots span { width: 12px; height: 12px; border-radius: 50%; }
    .dots span:nth-child(1) { background: #ff5f57; }
    .dots span:nth-child(2) { background: #febc2e; }
    .dots span:nth-child(3) { background: #28c840; }

    .terminal-title {
      flex: 1;
      text-align: center;
      font-size: 0.78rem;
      user-select: none;
    }

    .terminal-body { line-height: 0; background: var(--terminal-bg); }

    .terminal-body video,
    .terminal-body img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #0d1117;
    }

    footer {
      margin-top: 20px;
      font-size: 0.78rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="terminal-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="terminal-title">cortex — ~/project</div>
      <div style="width:52px"></div>
    </div>
    <div class="terminal-body">
      <video
        autoplay
        loop
        muted
        playsinline
        poster="assets/cortex-cli-welcome.png"
        aria-label="cortex-cli TUI preview">
        <source src="assets/cortex-cli-promo.mp4" type="video/mp4">
        <img src="assets/cortex-cli-screenshot.png" alt="cortex-cli TUI">
      </video>
    </div>
  </div>

  <footer>
    <a href="https://github.com/Mateooo93/cortex-cli">github</a>
  </footer>
</body>
</html>
